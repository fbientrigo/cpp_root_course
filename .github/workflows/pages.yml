name: Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  site:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.settings.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
      - name: Check one-time Pages configuration
        id: settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if kind=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null) && [ "$kind" = workflow ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Activa Settings > Pages > Source: GitHub Actions y vuelve a ejecutar Pages. https://github.com/$GITHUB_REPOSITORY/settings/pages"
            echo '## Activación pendiente' >> "$GITHUB_STEP_SUMMARY"
            echo 'Selecciona **Settings → Pages → Source: GitHub Actions**, luego vuelve a ejecutar este workflow.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    if: needs.site.outputs.enabled == 'true'
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
